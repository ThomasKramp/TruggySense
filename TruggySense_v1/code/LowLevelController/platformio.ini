[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	khoih-prog/TimerInterrupt_Generic @ ^1.13.0
	mikalhart/TinyGPSPlus@^1.1.0
	milesburton/DallasTemperature@^4.0.4
	adafruit/Adafruit BNO08x@^1.2.5
	paulstoffregen/PWMServo@^2.1
	nrf24/RF24@^1.4.11
	